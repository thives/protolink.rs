[package]
name = "protolink-lua"
version = "0.0.1"
authors = ["Thomas Ivesdal-Tronstad"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Remote-data v1 values, the session ledger and the execution lifecycle of lua.execution.v1, without a Lua VM."

[lib]
name = "protolink_lua"
crate-type = [ "rlib" ]
test = true
doctest = true
bench = false

[features]
default = []
# Scripted child client for tests of consumers of this crate.
testing = []

[dependencies]
micropb = { version = "0.6", features = ["alloc"] }
protolink-lua-api = { version = "0.0.1", path = "../protolink-lua-api", features = ["execution"] }
sha2 = { version = "0.10", default-features = false }
