[package]
name = "protolink-adaptors"
version = "0.0.3"
authors = [
  "Thomas Ivesdal-Tronstad <>",
]
license = "MIT OR Apache-2.0"
description = "Buffered ports and background runners that connect protolink to hardware buses such as I2C."
repository = "https://github.com/thives/protolink.rs"
keywords = ["i2c", "embedded", "no_std", "async", "grpc"]
edition = "2024"
rust-version = "1.88"

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", default-features = false, optional = true }
tokio-serial = { version = "5.5.0", default-features = false, optional = true }

[dependencies]
protolink-i2c = { version = "0", path = "../protolink-i2c", optional = true }
embedded-hal-async = { version = "1", optional = true }
embedded-io-async = "0.7"
atomic-waker = "1.1"
portable-atomic = { version = "1", optional = true, default-features = false }

[dev-dependencies]
protolink = { path = "../protolink", default-features = false, features = ["async", "std", "tokio"] }
embedded-hal = "1"
embedded-hal-async = "1"
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
static_cell = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "time", "sync"] }

[features]
default = ["i2c"]
# `i2c_controller` and `i2c_target`.
i2c = ["dep:protolink-i2c", "dep:embedded-hal-async"]
# Buffered UART factory (`uart`) over the `pump` module, for any split HAL UART.
# Adds no dependencies.
uart = []
# Linux serial port wrapper (`uart::linux::LinuxUart`) over `tokio-serial`.
# Compiled only for Linux targets; other targets ignore the feature.
uart-linux = ["uart", "dep:tokio", "dep:tokio-serial"]
# Atomics for targets without native compare-and-swap (e.g. thumbv6m).
portable-atomic = [
    "dep:portable-atomic",
    "atomic-waker/portable-atomic",
]
portable-atomic-critical-section = [
    "portable-atomic",
    "portable-atomic/critical-section",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
