syntax = "proto3";

package protolink.examples.embedded.device;

message GetStatus {}

message DeviceStatus {
  uint64 uptime_ms = 1;
  int32 temperature_milli_c = 2;
  uint32 supply_millivolts = 3;
}

message SetOutput {
  uint32 channel = 1;
  bool enabled = 2;
}

message OutputState {
  uint32 channel = 1;
  bool enabled = 2;
}

message Restart {
  uint32 delay_ms = 1;
}

message RestartAck {}

message Command {
  optional uint32 correlation_id = 1;
  oneof command {
    GetStatus get_status = 2;
    SetOutput set_output = 3;
    Restart restart = 4;
  }
}

message Reply {
  optional uint32 correlation_id = 1;
  oneof reply {
    DeviceStatus status = 2;
    OutputState output_state = 3;
    RestartAck restart_ack = 4;
  }
}

message EventSubscribe {}

message Event {
  uint32 code = 1;
}

message BatchSummary {
  uint32 accepted = 1;
  uint32 rejected = 2;
}

service Service {
  // Execute one command.
  rpc Command(Command) returns (Reply);
  // Replay the device's event log, then end the stream.
  rpc EventSubscribe(EventSubscribe) returns (stream Event);
  // Execute a batch of commands and report how many were accepted.
  rpc CommandBatch(stream Command) returns (BatchSummary);
  // Execute commands as they arrive and reply to each, in order. A rejected
  // command ends the stream with its error.
  rpc CommandStream(stream Command) returns (stream Reply);
}
