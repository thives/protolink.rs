[package]
name = "embedded-smoke"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Isolate target features from the root workspace's std/Tokio dev-dependencies.
[workspace]
resolver = "3"

[features]
default = []
async = ["protolink/async", "dep:embedded-io-async"]
blocking = ["protolink/blocking"]
compression = ["protolink/miniz-oxide"]

[dependencies]
protolink = { path = "../../protolink", default-features = false, features = ["micropb", "portable-atomic-critical-section"] }
micropb = { version = "0.6", default-features = false, features = ["alloc", "encode", "decode"] }
embedded-io = { version = "0.7", default-features = false }
embedded-io-async = { version = "0.7", default-features = false, optional = true }
critical-section = { version = "1", default-features = false, features = ["restore-state-u32"] }

[build-dependencies]
protolink-grpc-gen = { path = "../../protolink-grpc-gen" }
micropb-gen = "0.6"

[[bin]]
name = "embedded-smoke"
path = "src/main.rs"
required-features = ["async", "blocking"]
test = false
bench = false

[profile.release]
panic = "abort"
codegen-units = 1
