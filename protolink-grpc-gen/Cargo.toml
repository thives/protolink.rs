[package]
name = "protolink-grpc-gen"
version = "0.0.2"
authors = [
  "Thomas Ivesdal-Tronstad <>",
]
license = "MIT OR Apache-2.0"
description = "Generates protolink gRPC service traits, servers and clients for micropb or prost messages."
repository = "https://github.com/thives/protolink.rs"
keywords = ["grpc", "protobuf", "micropb", "prost", "codegen", "embedded"]
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "protolink-grpc-gen"
path = "src/main.rs"

[dependencies]
protobuf = "3"
protobuf-parse = "3"
prost = { version = "0.14", optional = true }
prost-build = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
unicode-ident = { version = "1", optional = true }

[features]
# Generate service bindings for prost-build messages (host-side only).
prost = ["dep:prost", "dep:prost-build", "dep:prost-types", "dep:unicode-ident"]
