[package]
name = "protolink-grpc-gen-compile-fixture-prost"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Deliberately isolated: no parent workspace or runtime dev-dependency features.
[workspace]

# prost only: `micropb` must stay out of this dependency tree.
[dependencies]
protolink-grpc = { path = "../../../protolink-grpc", default-features = false, features = ["prost"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
prost-types = { version = "0.14", default-features = false }

[build-dependencies]
protolink-grpc-gen = { path = "../..", features = ["prost"] }
prost-build = "0.14"
prost-types = "0.14"

[features]
default = ["server", "async-client", "blocking-client"]
server = []
async-client = []
blocking-client = []
