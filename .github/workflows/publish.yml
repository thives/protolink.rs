name: Publish crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - protolink
          - protolink-http2
          - protolink-grpc
          - protolink-grpc-gen

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish all crates
        if: ${{ inputs.crate == 'all' }}
        # Publishes all publishable workspace members.
        # publish = false crates are skipped by Cargo.
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}

      - name: Publish selected crate
        if: ${{ inputs.crate != 'all' }}
        run: cargo publish --package "${{ inputs.crate }}" --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
