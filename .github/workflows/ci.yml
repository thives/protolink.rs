name: ci
on: [push, pull_request]

jobs:
  check:
    name: Check build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --release --workspace --all-features

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - run: |
            cargo nextest r --workspace --all-features
            cargo test --workspace --doc --all-features

  grpcurl-interop:
    name: grpcurl interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install grpcurl
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build example server
        run: cargo build -p embedded-device-example --bin embedded-device-server
      - name: Exercise RPCs with grpcurl
        shell: bash
        run: |
          set -euo pipefail

          addr=127.0.0.1:50051
          proto=examples/embedded-device/proto
          service=protolink.examples.embedded.device.Service

          ./target/debug/embedded-device-server "$addr" >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if grpcurl -plaintext -import-path "$proto" -proto device.proto \
              -d '{"correlationId":7,"getStatus":{}}' "$addr" "$service/Command" \
              >/tmp/unary.json 2>/dev/null &&
              jq -e '.correlationId == 7 and has("status")' /tmp/unary.json >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat server.log
            exit 1
          fi

          printf '%s\n' \
            '{"correlationId":1,"setOutput":{"channel":0,"enabled":true}}' \
            '{"correlationId":2,"setOutput":{"channel":1,"enabled":true}}' \
            '{"correlationId":3,"setOutput":{"channel":9,"enabled":true}}' |
            grpcurl -plaintext -import-path "$proto" -proto device.proto -d @ \
              "$addr" "$service/CommandBatch" |
            jq -e '.accepted == 2 and .rejected == 1' >/dev/null

          printf '%s\n' \
            '{"correlationId":11,"getStatus":{}}' \
            '{"correlationId":12,"restart":{}}' |
            grpcurl -plaintext -import-path "$proto" -proto device.proto -d @ \
              "$addr" "$service/CommandStream" |
            jq -s -e 'length == 2 and .[0].correlationId == 11 and .[1].correlationId == 12' \
              >/dev/null

          grpcurl -plaintext -import-path "$proto" -proto device.proto \
            -d '{}' "$addr" "$service/EventSubscribe" >/tmp/events.json
          test ! -s /tmp/events.json

  miri:
    name: Miri (ring buffer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --features portable-atomic --lib link::ring

  cross-check:
    name: Check Cross-Compilation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - armv7-unknown-linux-gnueabihf
          - thumbv7em-none-eabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "armv7-unknown-linux-gnueabihf, thumbv7em-none-eabihf"
      - run: |
            cargo check --release --target=${{matrix.target}} --no-default-features -p protolink -p protolink-grpc -p protolink-http2
            cargo check --release --target=${{matrix.target}} --no-default-features --features async,blocking -p protolink -p protolink-grpc -p protolink-http2

  features:
    name: Check feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      # Dev-dependencies are excluded so that the `tokio` dev-dependency's
      # features can't hide a broken combination.
      - run: |
            cargo hack check --each-feature --no-dev-deps -p protolink -p protolink-grpc -p protolink-http2 -p protolink-grpc-gen
            cargo check --no-default-features --features async,std -p protolink
            cargo check --no-default-features --features blocking,std -p protolink
            cargo check --no-default-features --features async,blocking -p protolink
            cargo check --no-default-features --features async,blocking,std -p protolink

  semver:
    name: Public API vs last release (informational)
    runs-on: ubuntu-latest
    # Report only: the crates are 0.0.x, where any change may be breaking. The
    # output tells reviewers which public items changed. Move the baseline to
    # the newest release tag after each release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      # With an unchanged version the tool assumes a major bump and skips every
      # check, so ask for a patch-level comparison explicitly.
      - run: cargo semver-checks --workspace --exclude embedded-device-example --baseline-rev v0.0.2 --release-type patch --all-features

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-features

  docs:
    name: Check Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D missing_docs --cfg docsrs -Z unstable-options --generate-link-to-definition" cargo +nightly doc --workspace --all-features --no-deps

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
